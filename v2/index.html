<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<!-- maximum-scale=1: sąmoningas kompromisas — naršyklės pinch-zoom kariauja su žemėlapio kameros zoom (2026-09-04 auditas). Kaina: negalima priartinti sheet teksto naršykle; kompensuota ≥15px šriftu. -->
<title>Viskas, ko išmoksta Lietuvos vaikas · v2 (testinė)</title>
<meta property="og:title" content="Viskas, ko išmoksta Lietuvos vaikas">
<meta property="og:description" content="Atviras Lietuvos ugdymo programų žemėlapis: 2 129 mikro-temos ir 2 747 ryšiai — nuo darželio iki 12 klasės, 20 dalykų. Paliesk tašką ir pamatyk visą vaiko kelią.">
<meta property="og:image" content="https://krisvas333.github.io/vaiko-zemelapis/og.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://krisvas333.github.io/vaiko-zemelapis/v2/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://krisvas333.github.io/vaiko-zemelapis/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23D90429'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ☀️ LIGHT — Kris brand DNA (wiki/meta/brand-style.md). Full light palette on bare :root. */
:root{
  --ground:#FFFFFF;
  --surface:#F7F7F5;
  --surface-2:#F1EFEA;
  --ink:#0A0A0A;
  --muted:#595959;
  --line:#E5E2DE;
  --line2:#D6D2CC;
  --accent:#D90429;
  --accent-ink:#FFFFFF;
  --red:#FF0000;
  --ok:#1D7A3E;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:4px;
  --shadow:0 1px 2px rgba(10,10,10,.06);
  --shadow-lg:0 4px 20px rgba(10,10,10,.09);
  --sat:env(safe-area-inset-top);
  --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left);
  --sar:env(safe-area-inset-right);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;
  overflow:hidden;height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;overscroll-behavior:none}
canvas:active{cursor:grabbing}
button,select,input{font-family:inherit}

/* ---------- desktop chrome ---------- */
.hero{position:fixed;left:calc(28px + var(--sal));top:24px;max-width:360px;pointer-events:none;z-index:2}
.hero h1{font-family:var(--mono);font-size:1.7em;line-height:1.1;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
.hero h1 .dot{color:var(--accent)}
.hero p{color:var(--muted);font-size:15px;margin-top:12px;line-height:1.5}
.hero .stats b{color:var(--ink);font-family:var(--mono);font-weight:700}
.badge{display:inline-block;margin-top:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:var(--r);padding:7px 14px;font-size:14px;pointer-events:auto}
.badge b{color:var(--accent);font-family:var(--mono);font-weight:700;letter-spacing:.04em}
.credit{margin-top:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);line-height:1.5}
.disc{margin-top:6px;font-size:12.5px;line-height:1.45;color:var(--muted);max-width:340px}
.databtn{display:inline-flex;align-items:center;gap:7px;min-height:44px;margin-top:8px;pointer-events:auto;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);padding:9px 13px;font-size:14px;text-decoration:none;transition:background .2s,border-color .2s;cursor:pointer}
.databtn:hover{background:var(--surface-2);border-color:var(--line2)}
.hero .backlink{display:inline-flex;align-items:center;min-height:44px;pointer-events:auto;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);text-decoration:none}

.lang{position:fixed;top:24px;right:calc(24px + var(--sar));z-index:5;display:flex;gap:4px;background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:4px;box-shadow:var(--shadow)}
.lang button{border:0;background:transparent;color:var(--muted);border-radius:var(--r);min-height:44px;min-width:52px;padding:10px 16px;font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.08em;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
.toolbar{position:fixed;top:82px;right:calc(24px + var(--sar));z-index:5;display:flex;gap:8px;align-items:flex-start}
.tb-test{display:inline-flex;align-items:center;min-height:44px;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em;border-radius:var(--r);padding:11px 16px;text-decoration:none;white-space:nowrap}
.tb-search{position:relative}
.tb-search input{background:var(--ground);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);min-height:44px;padding:11px 14px;font-size:15px;width:190px;outline:none}
.tb-search input::placeholder{color:var(--muted)}
#qres{position:absolute;top:52px;right:0;width:290px;background:var(--ground);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:none;box-shadow:var(--shadow-lg)}
#qres.on{display:block}
#qres div{padding:11px 13px;font-size:15px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line)}
#qres div:hover{background:var(--surface)}
#qres div .qs{font-size:13px;color:var(--muted)}
#grade{background:var(--ground);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);min-height:44px;padding:11px 12px;font-size:15px;outline:none;cursor:pointer}
.cbanner{position:fixed;top:136px;right:calc(24px + var(--sar));z-index:5;background:var(--surface);border:1px solid var(--ok);color:var(--ok);border-radius:var(--r);padding:10px 14px;font-size:15px;display:none;align-items:center;gap:10px}
.cbanner.on{display:flex}
.cbanner button{background:transparent;border:0;color:var(--accent);cursor:pointer;font-weight:700;text-decoration:underline;font-size:1em;min-height:44px}

.legend{position:fixed;left:calc(28px + var(--sal));bottom:24px;background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;z-index:2;
  display:flex;flex-direction:column;max-height:min(46vh,430px,calc(100dvh - 590px));min-height:150px;box-shadow:var(--shadow)}
.legend h3{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:8px;text-transform:uppercase;flex:0 0 auto}
.legend #rows{overflow-y:auto;overscroll-behavior:contain;min-height:0;padding-right:4px}
.legend .row{display:flex;align-items:center;gap:8px;font-size:15px;padding:5px 0;cursor:pointer;user-select:none;color:var(--ink)}
.legend .row.off{opacity:.4}
.legend .swatch{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.legend .n{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:13px;padding-left:14px}

.panel{position:fixed;right:calc(20px + var(--sar));top:136px;width:340px;max-height:calc(100dvh - 160px);overflow-y:auto;background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:20px;z-index:3;opacity:0;transform:translateX(24px);pointer-events:none;transition:opacity .28s ease,transform .28s ease;box-shadow:var(--shadow-lg)}
.panel.open{opacity:1;transform:none;pointer-events:auto}
.tp .close{float:right;cursor:pointer;color:var(--muted);font-size:1.1em;padding:6px 10px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0}
.tp .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tp h2{font-family:var(--mono);font-size:1.15em;font-weight:800;letter-spacing:.01em;margin-bottom:8px;line-height:1.25}
.tp .desc{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:12px}
.tp .big{font-family:var(--mono);font-size:2em;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.tp .big small{font-family:var(--body);font-size:.4em;color:var(--muted);font-weight:400;margin-left:6px}
.tp h4{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.tp ul{list-style:none}
.tp li{font-size:15px;padding:6px 0;line-height:1.4;color:var(--ink)}
.tp li.link{cursor:pointer;min-height:44px;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:9px 0;border-bottom:1px solid var(--line)}
.tp ul li.link:last-child{border-bottom:0}
.tp li.link .lnm{display:flex;align-items:center;gap:6px}
.tp li.link:hover .lnm{color:var(--accent)}
.tp li .age{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:13px;padding-left:10px;white-space:nowrap}
.tp .lwhy{font-size:13.5px;line-height:1.4;color:var(--muted);padding-left:16px}
.tp .lmark{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);padding-left:16px}
.tp .lmark i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.tp .lmark.hard i{background:var(--ink)}
.tp .lmark.soft i{border:1.5px solid var(--line2);background:transparent}
.tp .llegend{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;margin-top:14px;line-height:1.5}
.tp .llegend i{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:5px}
.tp .llegend i.h{background:var(--ink)}
.tp .llegend i.s{border:1.5px solid var(--line2)}

/* ---------- 🎯 3 klausimai šįvakar ---------- */
.q3{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:14px 15px;margin-top:6px}
.q3 .q3meta{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.q3 ol{margin:0;padding-left:20px}
.q3 ol li{font-size:15.5px;line-height:1.45;padding:5px 0;color:var(--ink)}
.q3 .q3btns{display:flex;gap:8px;margin-top:13px}
.q3 .q3btns button{flex:1;min-height:44px;padding:11px 8px;border:1px solid var(--line2);background:var(--ground);color:var(--ink);border-radius:var(--r);font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer}
.q3 .q3btns button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.q3 .q3ok{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ok);margin-top:9px;display:none}
.q3 .q3ok.on{display:block}
.q3age{width:100%;background:var(--ground);border:1px solid var(--line2);color:var(--ink);border-radius:var(--r);min-height:46px;padding:12px;font-size:16px;outline:none;margin-bottom:12px}
/* ---------- ✉️ savaitinis laiškas ---------- */
.mlwrap{margin-top:10px}
.mltoggle{width:100%;min-height:44px;padding:11px 12px;background:var(--ground);border:1px solid var(--line2);color:var(--ink);border-radius:var(--r);font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer}
.mltoggle:hover{border-color:var(--accent);color:var(--accent)}
.mlbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.mlbox h5{font-family:var(--mono);font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--ink);margin-bottom:5px}
.mlbox .mllead{font-size:13.5px;line-height:1.45;color:var(--muted);margin-bottom:11px}
.mlbox label{display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.mlbox input[type=email],.mlbox select{width:100%;min-height:44px;padding:11px 12px;font-size:16px;background:var(--ground);border:1px solid var(--line2);color:var(--ink);border-radius:var(--r);outline:none;margin-bottom:10px}
.mlbox .mlcon{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.4;color:var(--ink);cursor:pointer;min-height:44px;padding:4px 0;text-transform:none;font-family:var(--body);font-weight:400;letter-spacing:0;margin-bottom:8px}
.mlbox .mlcon input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:var(--accent)}
.mlbox .mlsend{width:100%;min-height:44px;padding:12px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:var(--r);font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.05em;cursor:pointer}
.mlbox .mlsend:disabled{opacity:.55;cursor:default}
.mlbox .mlmsg{display:none;font-family:var(--mono);font-size:12px;line-height:1.45;letter-spacing:.03em;margin-top:9px}
.mlbox .mlmsg.on{display:block}
.mlbox .mlpriv{font-size:12px;line-height:1.45;color:var(--muted);margin-top:9px}
.mlhp{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.tb-q3{display:inline-flex;align-items:center;min-height:44px;background:var(--ground);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.05em;border-radius:var(--r);padding:11px 14px;cursor:pointer;white-space:nowrap}
.tb-q3:hover{border-color:var(--accent);color:var(--accent)}
.tp .ask{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:10px 12px;font-size:15px;line-height:1.45;color:var(--ink);margin-top:6px}

.hint{position:fixed;right:calc(24px + var(--sar));bottom:18px;color:var(--muted);font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;z-index:2}
.hint b{color:var(--ink);font-weight:700}

#tip{position:fixed;z-index:8;pointer-events:none;max-width:300px;background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;font-size:15px;line-height:1.45;color:var(--ink);box-shadow:var(--shadow-lg);opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease}
#tip.on{opacity:1;transform:none}
#tip .tname{font-family:var(--mono);font-weight:700;color:var(--ink);margin-bottom:3px}
#tip .tmeta{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
#tip .tmeta .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
#tip .tdesc{color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- about modal ---------- */
.about{position:fixed;inset:0;background:rgba(10,10,10,.42);z-index:30;display:none;align-items:center;justify-content:center}
.about.open{display:flex}
.about .sheet{background:var(--ground);border:1px solid var(--line);border-radius:var(--r);max-width:640px;width:calc(100vw - 32px);max-height:86dvh;overflow-y:auto;padding:26px 28px;box-shadow:var(--shadow-lg)}
.about h2{font-family:var(--mono);font-size:1.4em;font-weight:800;letter-spacing:.01em;text-transform:uppercase;margin-bottom:6px}
.about h4{font-family:var(--mono);color:var(--accent);font-size:15px;font-weight:700;letter-spacing:.04em;margin:16px 0 4px}
.about p{color:var(--muted);font-size:15px;line-height:1.55}
.about a{color:var(--accent)}
.about .close{float:right;cursor:pointer;color:var(--muted);font-size:1.2em;padding:6px 10px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0}
.about .foot{margin-top:18px;color:var(--muted);font-size:14px}
.about .discbox{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:14px 16px;font-size:14.5px;line-height:1.55;color:var(--ink);white-space:pre-line}
.about .backlink{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);text-decoration:none}

/* ---------- narrow desktop / tablet (721–1100): stack the toolbar, trim the hero ---------- */
@media(min-width:721px) and (max-width:1100px){
  .hero{max-width:300px}
  .hero p.stats{display:none}
  .toolbar{flex-direction:column;align-items:stretch;width:212px;top:80px}
  .tb-search input{width:100%}
  #qres{width:212px;top:50px}
  .cbanner{top:250px}
  .legend{max-height:min(36vh,320px,calc(100dvh - 590px))}
  .hint{display:none}
  .panel{top:auto;bottom:24px;max-height:calc(100dvh - 270px)}
}

/* ---------- mobile top bar ---------- */
.mtop{display:none}
.msheet{display:none}

@media(max-width:720px){
  .hero,.lang,.toolbar,.legend,.hint,.cbanner,.panel,#tip{display:none!important}

  .mtop{display:flex;position:fixed;top:0;left:0;right:0;z-index:12;align-items:center;gap:6px;
    padding:calc(var(--sat) + 5px) calc(8px + var(--sar)) 5px calc(10px + var(--sal));
    min-height:calc(44px + var(--sat));
    background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .mtop h1{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.045em;line-height:1.3;
    text-transform:uppercase;flex:1;min-width:0;color:var(--ink)}
  .mtop h1 .dot{color:var(--accent)}
  .mlang{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px;flex:0 0 auto}
  .mlang button{border:0;background:transparent;color:var(--muted);border-radius:2px;height:38px;min-width:38px;
    font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer}
  .mlang button.on{background:var(--accent);color:var(--accent-ink)}
  .mabout{flex:0 0 auto;height:44px;width:44px;display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);font-size:17px;cursor:pointer}

  /* ---------- bottom sheet ---------- */
  .msheet{display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:0;z-index:11;
    height:85dvh;background:var(--ground);border-top:1px solid var(--line);border-radius:14px 14px 0 0;
    box-shadow:0 -6px 26px rgba(10,10,10,.13);
    transform:translateY(var(--sy,60dvh));
    transition:transform .30s cubic-bezier(.32,.72,0,1);
    padding-bottom:var(--sab)}
  .msheet.dragging{transition:none}
  #mhead{flex:0 0 auto;padding:0 calc(14px + var(--sar)) 10px calc(14px + var(--sal));touch-action:none;cursor:grab}
  .mgrab{height:22px;display:flex;align-items:center;justify-content:center}
  .mgrab span{width:40px;height:4px;border-radius:2px;background:var(--line2);display:block}
  .mstrip{display:none;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--ok);
    color:var(--ok);border-radius:var(--r);padding:7px 10px;font-size:14px;margin-bottom:8px;line-height:1.3}
  .mstrip.on{display:flex}
  .mstrip button{background:transparent;border:0;color:var(--accent);text-decoration:underline;font-weight:700;font-size:14px;cursor:pointer;margin-left:auto;min-height:44px}
  .mtip2{display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 11px;font-size:14px;line-height:1.5;color:var(--ink);margin-bottom:9px;position:relative;padding-right:40px}
  .mtip2.on{display:block}
  .mtip2 button{position:absolute;top:0;right:0;height:44px;width:40px;background:transparent;border:0;color:var(--muted);font-size:16px;cursor:pointer}
  .mstats{font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:var(--muted);margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mstats b{color:var(--ink);font-weight:700}

  <h4>How was it made?</h4><p>AI agents distilled Lithuania's official <b>2022 national curricula</b> (emokykla.lt) and the NŠA early-childhood framework into teachable micro-concepts and a dependency graph. Educator review is in progress — hence "test version". Data is open (ODbL). Full method, quality checks, <b>limitations</b> and citation are on the <a href="../metodika/">methodology page</a>.</p>
  <h4>What's new in v2?</h4><p>A light design (same style as krisvas.lt), a <b>rebuilt mobile experience</b> — full-screen map, a bottom sheet instead of pop-ups, bigger touch targets — and deeper subject colours so the dots stay visible on white.</p>
  <h4>The original</h4><p>Inspired by <a href="https://withmarble.com/curriculum/" target="_blank" rel="noopener">Marble</a> — the open US/UK curriculum map (1,590 concepts). This is its Lithuanian sibling. Note: topic content is currently in Lithuanian.</p>
  <h4>How much can you trust a link?</h4><p>Links are not equal. <b>${nf(nHard||1221)} confirmed</b> (●) — the curriculum text itself says one topic builds on the other. <b>${nf(nSoft||1526)} likely</b> (○) — proposed by AI, plausible, but <b>not yet reviewed by teachers</b>. Every link shows <b>why</b> it is there.</p>

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);              /* perf: cap DPR at 2 */
const IS_TOUCH=(matchMedia('(hover:none)').matches)||('ontouchstart' in window);

let peekPx=140;

function topBarH(){const t=document.querySelector('.mtop');return t?t.offsetHeight:56}
function centers(){
  if(MOBILE){CX=W*0.5; CY=Math.max(120,(topBarH()+(H-peekPx))/2);}
  else {CX=W*0.5+120; CY=H*0.52;}
}
/* first-load framing: the whole cone must sit between the top bar and the peek sheet */
let camInit=false;
function fitCam(){
  if(!MOBILE){DEF.dist=1750;DEF.pitch=-0.10}
  else{
    const tip=document.getElementById('mtip2');
    const hintH=(tip&&tip.classList.contains('on'))?tip.offsetHeight+9:0;
    const stable=Math.max(96,peekPx-hintH);          /* peek height once the hint is gone */
    const band=Math.max(220,H-topBarH()-stable);
    /* nearest nodes are magnified by F/(dist-R_MAX) — solve that, not the flat height */
    DEF.dist=Math.max(1250,Math.min(1900,Math.round(R_MAX+2*520*F/band)));
    DEF.pitch=-0.06;
  }
  if(!camInit){cam.dist=DEF.dist;cam.pitch=DEF.pitch;camInit=true}
}
function resize(){
  W=innerWidth;H=innerHeight;MOBILE=innerWidth<=720;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ground=ctx.createRadialGradient(W*0.5,H*0.45,0,W*0.5,H*0.45,Math.max(W,H)*0.75);
  ground.addColorStop(0,'#FFFFFF');ground.addColorStop(1,'#F7F7F5');

}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,120));

function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
const DEF={yaw:0,pitch:-0.10,dist:1500,panX:0,panY:0};
if(MOBILE){DEF.dist=1250;DEF.pitch=-0.06}
const cam={...DEF};
const F=900,WORLD_H=980,R_MAX=460;
let tween=null,lastInteract=0,drag=null;
function tweenTo(t,dur=650){tween={t0:performance.now(),dur,from:{...cam},to:{...cam,...t}};kick()}
function stepTween(now){if(!tween)return;let k=Math.min(1,(now-tween.t0)/tween.dur);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;for(const p of ['yaw','pitch','dist','panX','panY'])cam[p]=tween.from[p]+(tween.to[p]-tween.from[p])*k;if(k>=1)tween=null}

/* perf: trig cached, recomputed only when yaw/pitch actually change */
let _ty=NaN,_tp=NaN,_cy=1,_sy=0,_cp=1,_sp=0;
function trig(){if(cam.yaw!==_ty){_ty=cam.yaw;_cy=Math.cos(_ty);_sy=Math.sin(_ty)}
                if(cam.pitch!==_tp){_tp=cam.pitch;_cp=Math.cos(_tp);_sp=Math.sin(_tp)}}
function project(t){
  const x=t.x3*_cy-t.z3*_sy, z=t.x3*_sy+t.z3*_cy, y=t.y3;
  const y2=y*_cp-z*_sp, z2=y*_sp+z*_cp;
  const zc=z2+cam.dist, s=F/Math.max(120,zc);
  return {x:CX+(x*s)+cam.panX, y:CY-(y2*s)+cam.panY, s, z:zc};
}

/* ---------------- data ---------------- */
Promise.all([
  fetch('../data/topics.json?v='+Date.now()).then(r=>r.json()),
  fetch('../data/dependencies.json?v='+Date.now()).then(r=>r.json())
]).then(([T,D])=>{
  topics=T.topics;deps=D.dependencies;
  topics.forEach(t=>{byId[t.id]=t;childs[t.id]=[];pars[t.id]=[];
    const h=hash(t.id);t.theta=(h%3600)/3600*Math.PI*2;t.rr=.35+((h>>4)%1000)/1000*.65;
    const jit=(((h>>8)%100)-50)/50;
    t.age=(t.ageRangeStart+t.ageRangeEnd)/2;
    const a=(t.age-3)/10;
    t.y3=(a-0.5)*WORLD_H+jit*30;
    const R=(0.22+0.78*a)*R_MAX*t.rr;
    t.x3=Math.cos(t.theta)*R;t.z3=Math.sin(t.theta)*R;
    t.baseR=1.7+t.centrality*16;});
  deps.forEach(e=>{childs[e.prerequisiteId].push(e.topicId);pars[e.topicId].push(e.prerequisiteId);
    EDGE[ekey(e.prerequisiteId,e.topicId)]=e;if(e.strength==='hard')nHard++;else nSoft++;});
  /* neural intro: BFS wave from the highest-centrality seeds */
  const seeds=[...topics].sort((a,b)=>b.centrality-a.centrality).slice(0,7).map(t=>t.id);
  const depth={};let frontier=[...seeds];seeds.forEach(s=>depth[s]=0);let dmax=0;
  const und={};topics.forEach(t=>und[t.id]=[]);
  deps.forEach(e=>{und[e.topicId].push(e.prerequisiteId);und[e.prerequisiteId].push(e.topicId)});
  while(frontier.length){const nf2=[];
    for(const n of frontier)for(const m of und[n])if(depth[m]===undefined){depth[m]=depth[n]+1;dmax=Math.max(dmax,depth[m]);nf2.push(m)}
    frontier=nf2;}
  topics.forEach(t=>{const d=depth[t.id]!==undefined?depth[t.id]:dmax+1;
    t.reveal=d*240+((hash(t.id)>>6)%200);introMax=Math.max(introMax,t.reveal);});
  introStart=performance.now()+400;

  const order=[...new Set(topics.map(t=>t.subject))]
    .sort((a,b)=>topics.filter(t=>t.subject===b).length-topics.filter(t=>t.subject===a).length);
  nSubj=order.length;
  const rows=document.getElementById('rows'),mrows=document.getElementById('mrows');
  rows.innerHTML='';mrows.innerHTML='';
  order.forEach(s=>{on[s]=1;
    if(!COLORS[s]){COLORS[s]=FALLBACK;RINGC[s]=FALLBACK_RING;RGB[s]=RGBF;RGBR[s]=RGBFR}
    const n=topics.filter(t=>t.subject===s).length;
    [rows,mrows].forEach(host=>{
      const div=document.createElement('div');div.className='row';div.dataset.s=s;
      div.innerHTML=`<span class="swatch" style="background:${COLORS[s]}"></span><span class="lbl">${esc(subjName(s))}</span><span class="n">${n}</span>`;
      div.onclick=()=>{on[s]=!on[s];
        document.querySelectorAll(`[data-s="${CSS.escape(s)}"]`).forEach(d=>d.classList.toggle('off',!on[s]));kick()};
      host.appendChild(div);});
  });
  applyLang();measurePeek();centers();

  const dbg=DEBUG.split(',').filter(Boolean);
  const dsel=dbg.find(x=>x.startsWith('select:'));
  if(dsel){const id=dsel.slice(7);if(byId[id])setTimeout(()=>{introDone=true;select(byId[id]);kick()},60)}
  else if(dbg.includes('top'))setTimeout(()=>{introDone=true;select([...topics].sort((a,b)=>b.centrality-a.centrality)[0]);kick()},60);
  else if(dbg.includes('half'))setTimeout(()=>{sheetTo('half');kick()},60);
  if(QS.has('present'))setTimeout(startPresent,300);
  kick();
});

/* ---------------- present mode ---------------- */
function startPresent(){
  present=true;document.body.classList.add('present');
  const byC=[...topics].sort((a,b)=>b.centrality-a.centrality);
  const keystone=byC[0];
  const later=[...topics].filter(t=>t.ageRangeStart>=13).sort((a,b)=>b.centrality-a.centrality)[0]||byC[3];
  const closeP=()=>{sel=null;ancestors=new Set();descendants=new Set();closeTopic();};
  [[400,()=>tweenTo({dist:1750,pitch:-0.05},1600)],
   [7000,()=>tweenTo({dist:1250,pitch:-0.02},1500)],
   [8800,()=>{if(keystone)select(keystone)}],
   [14000,()=>{if(later)select(later)}],
   [19500,()=>{closeP();tweenTo({yaw:cam.yaw,pitch:-0.08,dist:1650,panX:0,panY:0},1800)}]
  ].forEach(([t,fn])=>setTimeout(fn,t));

/* ---------------- render loop (render-on-demand) ---------------- */
let running=false,dirty=true;
const STATIC=DEBUG.split(',').includes('static');   /* capture/QA: no intro, no spin, one frame */
const SPIN=!MOBILE&&!IS_TOUCH&&!REDUCED&&!STATIC;   /* the signature slow spin — desktop only */
let zOrder=[];                                      /* perf: reused, sorted in place */
function kick(){lastInteract=performance.now();dirty=true;
  if(!running){running=true;requestAnimationFrame(frame)}}

function frame(now){
  stepTween(now);
  trig();
  const it=now-introStart;
  if(STATIC)introDone=true;
  if(!introDone&&it>introMax+900)introDone=true;
  const spinning=(present&&!tween)||(SPIN&&!sel&&!tween&&now-lastInteract>4000);
  if(spinning)cam.yaw+=present?0.0016:0.0015;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(ground){ctx.fillStyle=ground;ctx.fillRect(0,0,W,H)}else{ctx.clearRect(0,0,W,H)}

  const P={};let zmin=1e9,zmax=-1e9;
  for(const t of topics){const p=project(t);P[t.id]=p;if(p.z<zmin)zmin=p.z;if(p.z>zmax)zmax=p.z}
  const zr=Math.max(1,zmax-zmin);
  /* edges: darker tint, alpha 0.18–0.35 by zoom */
  const EA=0.35-0.17*Math.min(1,Math.max(0,(cam.dist-650)/2150));
  for(const e of deps){
    const a=byId[e.prerequisiteId],b=byId[e.topicId];
    if(!a||!b)continue;
    if(!on[a.subject]&&!on[b.subject])continue;
    let grow=1,flash=0;
    if(!introDone){
      const born=Math.max(a.reveal,b.reveal)+150;
      const ea=it-born;if(ea<0)continue;
      grow=Math.min(1,ea/340);
      if(ea<640)flash=(1-ea/640);
    }
    const hl=sel&&((ancestors.has(e.topicId)||e.topicId===sel.id)&&(ancestors.has(e.prerequisiteId)||e.prerequisiteId===sel.id));
    const pa=P[a.id],pb=P[b.id];
    const ex=pa.x+(pb.x-pa.x)*grow,ey=pa.y+(pb.y-pa.y)*grow;
    if(hl){ctx.strokeStyle='rgba(217,4,41,.85)';ctx.lineWidth=1.9}
    else if(sel){ctx.strokeStyle='rgba(10,10,10,.07)';ctx.lineWidth=.5}
    else{ctx.strokeStyle=rgbaR(a.subject,EA*(1-flash*.4)+flash*.55);ctx.lineWidth=.55+flash*.9}
    ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(ex,ey);ctx.stroke();
  }
  /* nodes far -> near (perf: reuse one array, sort in place — no per-frame allocation) */
  if(zOrder.length!==topics.length)zOrder=topics.slice();
  zOrder.sort((a,b)=>P[b.id].z-P[a.id].z);
  /* the phone sits further back, so dots get a bigger radius to stay legible */
  const rs=MOBILE?1.55:1.2, rmin=MOBILE?1.6:1.0;
  for(const t of zOrder){
    if(!on[t.subject])continue;
    let scale=1,born=1;
    if(!introDone){
      const na=it-t.reveal;if(na<0)continue;
      scale=Math.min(1,na/320);scale=1-Math.pow(1-scale,3);
      born=Math.min(1,Math.max(0,na/620));
    }
    const p=P[t.id],dep=1-(p.z-zmin)/zr;
    let r=Math.max(rmin,t.baseR*p.s*rs)*scale, al=.42+.58*dep;
    const isSel=sel&&t.id===sel.id,isAnc=sel&&ancestors.has(t.id),isDesc=sel&&descendants.has(t.id);
    if(sel){if(isSel||isAnc)al=1;else if(isDesc)al=Math.min(1,al+.2);else al*=.35}
    let col=COLORS[t.subject],ring=RINGC[t.subject];
    if(!introDone&&born<1){col=mixInk(t.subject,born);ring=col}
    if(ageLo!==null&&!(t.ageRangeStart<ageHi&&t.ageRangeEnd>ageLo))al*=.16;
    if(childMode&&!sel){
      if(CHILD.known.has(t.id)){col='#1D7A3E';ring='#0F4F27';al=Math.max(al,.95)}
      else if(CHILD.ready.has(t.id)){col=ACCENT;ring='#8F0219';al=Math.max(al,.9);r*=1.2}
      else{col='#9A948C';ring='#6E6862';al*=.4}
    }
    if(searchHit){if(searchHit.has(t.id)){al=1;r*=1.5;col=ACCENT;ring='#8F0219'}else al*=.18}
    if(isSel){col=ACCENT;ring='#8F0219'}
    ctx.globalAlpha=al;
    ctx.beginPath();ctx.arc(p.x,p.y,isSel?r+3:(isAnc?r+1:r),0,7);
    ctx.fillStyle=col;ctx.fill();
    if(r>1.6){ctx.lineWidth=1;ctx.strokeStyle=ring;ctx.stroke()}       /* 1px darker ring */
    if(isSel||isAnc){                                                   /* soft red halo */
      ctx.globalAlpha=.30;ctx.strokeStyle=ACCENT;ctx.lineWidth=isSel?3:2;
      ctx.beginPath();ctx.arc(p.x,p.y,r+(isSel?8:4),0,7);ctx.stroke();
      if(isSel){ctx.globalAlpha=.12;ctx.fillStyle=ACCENT;ctx.beginPath();ctx.arc(p.x,p.y,r+16,0,7);ctx.fill()}
    }
  }
  ctx.globalAlpha=1;

  if(STATIC){running=false;return}
  const busy=!introDone||tween||drag||present||spinning||dirty;
  if(busy){dirty=false;requestAnimationFrame(frame);return}
  if(now-lastInteract<1500){requestAnimationFrame(frame);return}
  running=false;                     /* idle: loop paused, kick() resumes it */
}

function collect(id,map,out){(map[id]||[]).forEach(n=>{if(!out.has(n)){out.add(n);collect(n,map,out)}})}

/* ---------------- pointer / touch ---------------- */

    const dx=e.touches[0].clientX-drag.x,dy=e.touches[0].clientY-drag.y;
    cam.yaw+=dx*.005;cam.pitch=Math.max(-.9,Math.min(.9,cam.pitch-dy*.003));
    drag.x=e.touches[0].clientX;drag.y=e.touches[0].clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);
  } else if(e.touches.length===2&&pinch){
    const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
    if(d>0)cam.dist=Math.max(650,Math.min(2800,cam.dist*pinch.d/d));
    cam.panX+=mx-pinch.mx;cam.panY+=my-pinch.my;                   /* two-finger pan */
    pinch={d,mx,my};

cv.addEventListener('touchend',e=>{

  const was=drag&&drag.moved>8,had=!!drag;drag=null;
  if(e.touches.length<2)pinch=null;
  if(had&&!was&&t){
    const now=performance.now();
    if(now-lastTapT<330&&Math.hypot(t.clientX-lastTapX,t.clientY-lastTapY)<40){
      tweenTo({...DEF},600);lastTapT=0;return;                     /* double-tap reset */
    }
    lastTapT=now;lastTapX=t.clientX;lastTapY=t.clientY;
    pick(t.clientX,t.clientY);
  }
  kick();},{passive:true});

function pick(mx,my){
  trig();

  for(const t of topics){if(!on[t.subject])continue;const p=project(t);
    const d=(p.x-mx)**2+(p.y-my)**2;if(d<bd){bd=d;best=t}}
  if(best)select(best);
  else{sel=null;ancestors=new Set();descendants=new Set();closeTopic();kick()}
}

   🎯 "3 klausimai šįvakar" — three curriculum questions a parent
   can ask tonight. Built from assessmentPrompt + fillName() grammar.
   ============================================================ */
let Q3N=0;const Q3TEXT={};
function q3Pick(t){
  const out=[t],seen=new Set([t.id]);
  const push=x=>{if(out.length<3&&x&&!seen.has(x.id)&&x.assessmentPrompt){seen.add(x.id);out.push(x)}};
  const byC=a=>a.sort((x,y)=>(y.centrality||0)-(x.centrality||0)||(x.id<y.id?-1:1));
  byC((pars[t.id]||[]).map(id=>byId[id]).filter(Boolean)).forEach(push);            /* 1. remiasi */
  byC((childs[t.id]||[]).map(id=>byId[id]).filter(Boolean)).forEach(push);          /* 2. atrakina */
  if(out.length<3)byC(topics.filter(x=>x.subject===t.subject
      &&x.ageRangeStart<t.ageRangeEnd&&x.ageRangeEnd>t.ageRangeStart)).forEach(push); /* 3. tas pats dalykas + amžius */
  if(out.length<3)byC(topics.slice()).forEach(push);
  return out.slice(0,3);
}
function q3Card(list,ageLbl,subjLbl){
  const S=STR[LANG],key='q3_'+(++Q3N);
  const lines=list.map(x=>fillName(x.assessmentPrompt||''));
  Q3TEXT[key]=S.q3cap(ageLbl,subjLbl)+'\n'+lines.map((l,i)=>(i+1)+'. '+l).join('\n')+'\n'+S.q3foot;
  return `<div class="q3" data-q3="${key}">
    <div class="q3meta">${esc(ageLbl)} ${esc(S.yrs)} · ${esc(subjLbl)}</div>
    <ol>${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ol>
    <div class="q3btns">
      <button class="primary" onclick="q3copy(this)">${S.q3copy}</button>
      <button onclick="q3share(this)">${S.q3share}</button>
    </div>
    <div class="q3ok"></div></div>`;
}
function q3Block(t){const S=STR[LANG];const list=q3Pick(t);if(list.length<3)return '';
  const subj=[...new Set(list.map(x=>subjName(x.subject)))].join(' · ');
  return `<h4>${S.q3h}</h4>`+q3Card(list,`${t.ageRangeStart}–${t.ageRangeEnd}`,subj)+mlForm(t,false);}
function q3Say(btn,msg,ok){const b=btn.closest('.q3');if(!b)return;const e=b.querySelector('.q3ok');if(!e)return;
  e.textContent=msg;e.style.color=ok?'var(--ok)':'var(--accent)';e.classList.add('on');
  clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800)}
function q3Text(btn){const b=btn.closest('.q3');return b?(Q3TEXT[b.dataset.q3]||''):''}
async function q3copy(btn){const S=STR[LANG],txt=q3Text(btn);let ok=false;
  try{await navigator.clipboard.writeText(txt);ok=true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);
      ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');ta.remove()}catch(e2){ok=false}}
  q3Say(btn,ok?S.q3ok:S.q3fail,ok);}
async function q3share(btn){const txt=q3Text(btn);
  if(navigator.share){try{await navigator.share({text:txt});return}catch(e){if(e&&e.name==='AbortError')return}}

/* daily picker — deterministic per (day, age): new questions every morning */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function q3Age(){const a=parseInt(localStorage.getItem('vz-q3-age')||'',10);return (a>=3&&a<=18)?a:8}
function q3Daily(age){
  if(!topics.length)return [];
  const day=new Date().toISOString().slice(0,10);
  const rnd=mulberry32(hash(day+'|'+age));
  let pool=topics.filter(t=>t.assessmentPrompt&&t.ageRangeStart<=age&&t.ageRangeEnd>age);
  if(pool.length<3)pool=topics.filter(t=>t.assessmentPrompt);
  const bySub={};pool.forEach(t=>{(bySub[t.subject]=bySub[t.subject]||[]).push(t)});
  const subs=Object.keys(bySub).sort();
  subs.forEach(k=>bySub[k].sort((a,b)=>(b.centrality||0)-(a.centrality||0)||(a.id<b.id?-1:1)));
  for(let i=subs.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[subs[i],subs[j]]=[subs[j],subs[i]]}
  const out=[],seen=new Set();
  for(const k of subs){if(out.length>=3)break;
    const top=bySub[k].slice(0,8),t=top[Math.floor(rnd()*top.length)];
    if(t&&!seen.has(t.id)){seen.add(t.id);out.push(t)}}
  if(out.length<3){const flat=pool.slice().sort((a,b)=>(b.centrality||0)-(a.centrality||0)||(a.id<b.id?-1:1));
    for(const t of flat){if(out.length>=3)break;if(!seen.has(t.id)){seen.add(t.id);out.push(t)}}}
  return out.slice(0,3);
}
function openQ3(){document.getElementById('q3modal').classList.add('open');renderQ3()}
function closeQ3(){document.getElementById('q3modal').classList.remove('open')}
function setQ3Age(v){localStorage.setItem('vz-q3-age',String(v));renderQ3()}
function renderQ3(){
  const S=STR[LANG],age=q3Age(),list=q3Daily(age);
  const subj=[...new Set(list.map(x=>subjName(x.subject)))].join(' · ');
  let opts='';for(let a=3;a<=18;a++)opts+=`<option value="${a}"${a===age?' selected':''}>${a} ${S.yrs}</option>`;
  document.getElementById('q3sheet').innerHTML=
    `<button class="close" onclick="closeQ3()" aria-label="✕">✕</button>
     <h2>${S.q3daily}</h2>
     <h4>${S.q3ageH}</h4>
     <select class="q3age" onchange="setQ3Age(this.value)" aria-label="${esc(S.q3ageH)}">${opts}</select>
     ${list.length?q3Card(list,String(age),subj):`<p>${esc(S.q3wait)}</p>`}

}

 document.getElementById('tbTest').textContent=S.cta;
 document.getElementById('q').placeholder=S.searchPh;
 buildGrades();updGradeLbl();if(childMode)showBanner();}
function showBanner(){const isEn=LANG==='en';
 const txt=`✅ ${isEn?'Showing':'Rodoma'}: <b>${esc(CHILD.label||(isEn?'your child':'jūsų vaikas'))}</b> <button onclick="exitChild()">${isEn?'exit':'išjungti'}</button>`;
 const b=document.getElementById('cbanner');b.innerHTML=txt;b.classList.add('on');
 const m=document.getElementById('mstrip');m.innerHTML=txt;m.classList.add('on');
 measurePeek();}
function exitChild(){childMode=false;
 document.getElementById('cbanner').classList.remove('on');
 const m=document.getElementById('mstrip');m.classList.remove('on');m.innerHTML='';
 measurePeek();kick();}
window.exitChild=exitChild;
buildGrades();updGradeLbl();
if(QS.get('mode')==='child'&&loadChild()){childMode=true;setTimeout(showBanner,60)}
document.addEventListener('click',e=>{if(!e.target.closest('.tb-search')){const r=document.getElementById('qres');if(r)r.classList.remove('on')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAbout();closeQ3();closeTopic(true)}});

/* ---------------- hover tooltip (pointer devices only) ---------------- */
const tipEl=document.getElementById('tip')||(()=>{const d=document.createElement('div');d.id='tip';document.body.appendChild(d);return d})();
function showTip(t,mx,my){
  const yrs=STR[LANG].yrs;
  const col=COLORS[t.subject]||FALLBACK;
  const d=(t.description||'');
  const desc=d.length>170?(d.slice(0,167).replace(/\s+\S*$/,'')+'…'):d;
  tipEl.innerHTML='<div class="tname">'+esc(t.name)+'</div>'
    +'<div class="tmeta"><span class="dot" style="background:'+col+'"></span>'+esc(subjName(t.subject))
    +(t.domain?' · '+esc(t.domain):'')+' · '+t.ageRangeStart+'–'+t.ageRangeEnd+' '+yrs+'</div>'
    +'<div class="tdesc">'+esc(desc)+'</div>';
  tipEl.classList.add('on');
  const r=tipEl.getBoundingClientRect();
  let x=mx+16,y=my+14;
  if(x+r.width>innerWidth-10)x=mx-r.width-14;
  if(y+r.height>innerHeight-10)y=my-r.height-12;
  tipEl.style.left=Math.max(8,x)+'px';tipEl.style.top=Math.max(8,y)+'px';
}
function hideTip(){tipEl.classList.remove('on');cv.style.cursor='grab'}
if(!IS_TOUCH){                                   /* perf: no hover picking on touch */
  cv.addEventListener('mousemove',e=>{
    if(drag||MOBILE){hideTip();return}
    trig();
    let best=null,bd=16*16;
    for(const t of topics){if(on[t.subject]===false)continue;const p=project(t);
      const d=(p.x-e.clientX)**2+(p.y-e.clientY)**2;if(d<bd){bd=d;best=t}}
    if(best){showTip(best,e.clientX,e.clientY);cv.style.cursor='pointer'}else hideTip();
  });
  cv.addEventListener('mouseleave',hideTip);
  cv.addEventListener('mousedown',hideTip);
  addEventListener('blur',hideTip);
}
resize();
if(DEBUG.split(',').includes('diag')){
  setTimeout(()=>{const r=msheet.getBoundingClientRect(),m=document.querySelector('.mtop').getBoundingClientRect();
    document.title='DIAG topics='+topics.length+' MOBILE='+MOBILE+' peekPx='+peekPx
      +' sy='+msheet.style.getPropertyValue('--sy')+' sheetTop='+Math.round(r.top)
      +' headH='+mhead.offsetHeight+' CX='+Math.round(CX)+' CY='+Math.round(CY)
      +' topW='+Math.round(m.width)+' topH='+Math.round(m.height)
      +' h1W='+Math.round(document.querySelector('.mtop h1').getBoundingClientRect().width)
      +' introDone='+introDone+' W='+W+' H='+H+' dist='+Math.round(cam.dist)
      +' PARITY='+(()=>{const a=Object.keys(STR.lt),b=Object.keys(STR.en);
        const m=a.filter(k=>!b.includes(k)).concat(b.filter(k=>!a.includes(k)));
        return m.length?('MISSING:'+m.join('/')):'ok('+a.length+' keys)'})();},4000);
}
