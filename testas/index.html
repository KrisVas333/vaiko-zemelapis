/* Klausimų tekstai yra LIETUVIŠKI ir EN režime — verčiam tik sąsają, ne patį sakinį,
   todėl {{name}} visada gauna lietuvišką linksnį (EN vaizde prie jų kabinam „LT" ženklą). */
const GEN_W=['po','iš','be','pas','vieną','dėl','prie','nuo','link'];   /* kilmininkas */
const ACC_W=['priešais','apie','per','pro'];                            /* galininkas */
const RE_ACC=/^(paskir|pakvies|pasodink)/;
const RE_GEN=/^(paklaus|paprašy|klausk|pasiteirau|teiraukit|perskaitę|peržiūrėję|išklausę|nufilmuo|nufotografuo|įrašy)/;
const RE_DAT=/^(duok|leisk|pasiūlyk|parodyk|padėk|primink|paduok|užraš|perskaity|paskaity|padiktuo|nupieš|nubrėž|nubraiž|papasakok|pasakyk|sakyk|paleisk|suren|užmink|pagrok|padainuok|įjunk|parašy|skaityk)/;
function fillName(txt){if(!txt)return txt;
  return txt.replace(/(\S+)?\s*\{\{name\}\}/g,(m,pre)=>{
    const p=(pre||'').toLowerCase().replace(/[^a-ząčęėįšųūž]/g,''),j=(pre?pre+' ':'');
    if(p==='su')return j+'jūsų vaiku';                                  /* įnagininkas */
    if(ACC_W.includes(p)||RE_ACC.test(p))return j+'jūsų vaiką';
    if(GEN_W.includes(p)||RE_GEN.test(p))return j+'jūsų vaiko';
    if(RE_DAT.test(p))return j+'jūsų vaikui';                           /* naudininkas */
    return j+'jūsų vaikas';});}                                         /* vardininkas: „ar", „kai" */
function ltTag(){return LANG==='en'?' <span class="ltag">LT</span>':''}
/* season face — the question a parent is actually asking this month */
function seasonH(){const S=T[LANG],m=new Date().getMonth()+1;
  if(m>=9&&m<=10)return S.seasons.a;
  if(m>=11&&m<=12)return S.seasons.b;
  if(m<=2)return S.seasons.c;
  if(m<=5)return S.seasons.d;
  return S.seasons.e;}

/* 🎯 3 klausimai šįvakar — same card as the map */
let Q3N=0;const Q3TEXT={};
function q3Card(list,ageLbl,subjLbl){
  const S=T[LANG],key='q3_'+(++Q3N);
  const lines=list.map(x=>fillName(x.assessmentPrompt||x.description||''));
  Q3TEXT[key]=S.q3cap(ageLbl,subjLbl)+'\n'+lines.map((l,i)=>(i+1)+'. '+l).join('\n')+'\n'+S.q3foot;
  return `<div class="q3" data-q3="${key}">
    <div class="q3meta">${esc(ageLbl)} ${esc(S.yrs)} · ${esc(subjLbl)}</div>
    <ol>${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ol>
    <div class="q3btns">
      <button class="primary" onclick="q3copy(this)">${S.q3copy}</button>
      <button onclick="q3share(this)">${S.q3share}</button>
    </div>
    <div class="q3ok"></div></div>`;
}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function q3Say(btn,msg,ok){const b=btn.closest('.q3');if(!b)return;const e=b.querySelector('.q3ok');if(!e)return;
  e.textContent=msg;e.style.color=ok?'var(--ok)':'var(--accent)';e.classList.add('on');
  clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800)}
function q3Text(btn){const b=btn.closest('.q3');return b?(Q3TEXT[b.dataset.q3]||''):''}
async function q3copy(btn){const S=T[LANG],txt=q3Text(btn);let ok=false;
  if(typeof bt==='function')bt('value',{door:'q3copy'});
  try{await navigator.clipboard.writeText(txt);ok=true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);
      ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');ta.remove()}catch(e2){ok=false}}
  q3Say(btn,ok?S.q3ok:S.q3fail,ok);}
async function q3share(btn){const txt=q3Text(btn);
  if(typeof bt==='function')bt('value',{door:'q3share'});
  if(navigator.share){try{await navigator.share({text:txt});return}catch(e){if(e&&e.name==='AbortError')return}}
  q3copy(btn);}
window.q3copy=q3copy;window.q3share=q3share;

  const say=(txt,ok)=>{msg.textContent=txt;msg.style.color=ok?'var(--ok)':'var(--accent)';msg.classList.add('on')};

function setLang(l){LANG=l;localStorage.setItem('vz-lang',l);document.getElementById('lLT').classList.toggle('on',l==='lt');document.getElementById('lEN').classList.toggle('on',l==='en');render()}
window.setLang=setLang;

Promise.all([fetch('../data/topics.json').then(r=>r.json()),fetch('../data/dependencies.json').then(r=>r.json())]).then(([TT,DD])=>{
  topics=TT.topics;topics.forEach(t=>{byId[t.id]=t;pars[t.id]=[]});
  DD.dependencies.forEach(e=>{if(pars[e.topicId])pars[e.topicId].push(e.prerequisiteId)});
  if(document.getElementById('lEN')) document.getElementById(LANG==='en'?'lEN':'lLT').classList.add('on');
  render();
});
/* Nešališkumas (bias auditas 2026-09-04): temos renkamos RATU per visus tos klasės dalykus —
   po vieną iš kiekvieno per ratą. Centralumas lemia tik eilę dalyko viduje (lygiosios — pagal
   pavadinimą, ne id). Todėl nė vienas dalykas, turintis temų šioje amžiaus juostoje, negauna nulio,
   o informatika negali pakilti virš savo dalies programoje. */
function pickBackbone(c){
  const inC=topics.filter(t=>t.ageRangeStart>=c.lo && t.ageRangeStart<c.hi);
  const bySubj={};
  for(const t of inC){(bySubj[t.subject]=bySubj[t.subject]||[]).push(t)}
  const subs=Object.keys(bySubj).sort((a,b)=>bySubj[b].length-bySubj[a].length||a.localeCompare(b,'lt'));
  subs.forEach(k=>bySubj[k].sort((x,y)=>(y.centrality||0)-(x.centrality||0)
      ||String(x.name).localeCompare(String(y.name),'lt')));
  const out=[];
  for(let round=0;out.length<14;round++){
    let added=false;
    for(const k of subs){const t=bySubj[k][round];if(!t)continue;out.push(t);added=true;if(out.length>=14)break}
    if(!added)break;
  }
  return out;
}
function knownSet(){
  const known=new Set();
  const add=id=>{if(known.has(id))return;known.add(id);(pars[id]||[]).forEach(add)};
  for(const t of backbone) if(marks[t.id]==='yes') add(t.id);
  return known;
}
function render(){
  const S=T[LANG];
  document.getElementById('foot').innerHTML=S.foot;
  const app=document.getElementById('app');
  if(!cls){
    app.innerHTML=`<h1>${seasonH()}</h1><p class="lead">${S.lead}</p><span class="reassure">${S.reassure}</span>
      <div class="step"><b>${S.pick}</b><div class="gridc">${CLASSES.map(c=>`<div class="gcard" onclick="chooseClass('${c.id}')">${c[LANG]}<span class="a">${c.a}</span></div>`).join('')}</div></div>`;
    return;
  }
  if(app.dataset.mode!=='result'){
    app.dataset.mode='mark';
    const done=Object.keys(marks).length;
    app.innerHTML=`<h1>${cls[LANG]} <span style="color:var(--muted);font-size:.6em">${cls.a}</span></h1>
      <p class="lead">${S.markLead(cls)}</p>
      <div id="cards"></div>
      <div class="bar"><div class="prog" id="prog"></div><button class="btn" id="seeBtn" onclick="showResult()">${S.see}</button>
      <button class="btn ghost" onclick="cls=null;marks={};render()">${S.again}</button></div>`;
    const cw=document.getElementById('cards');
    cw.innerHTML=backbone.map(t=>`<div class="tcard">
        <div class="subj" style="color:${COL[t.subject]||'var(--muted)'}">● ${subjName(t.subject)}</div>
        <h3>${t.name}</h3>
        <div class="ev">${(t.evidence&&t.evidence[0])||t.description||''}</div>
        <div class="opts">
          <button class="yes${marks[t.id]==='yes'?' on':''}" onclick="mark('${t.id}','yes')">${S.yes}</button>
          <button class="part${marks[t.id]==='part'?' on':''}" onclick="mark('${t.id}','part')">${S.part}</button>
          <button class="no${marks[t.id]==='no'?' on':''}" onclick="mark('${t.id}','no')">${S.no}</button>
        </div></div>`).join('');
    updateProg();
    return;
  }
  showResult(); // result mode: re-render on language toggle
}
function chooseClass(id){cls=CLASSES.find(c=>c.id===id);marks={};backbone=pickBackbone(cls);const a=document.getElementById('app');a.dataset.mode='mark';render()}
window.chooseClass=chooseClass;
function mark(id,v){marks[id]=(marks[id]===v?undefined:v);if(marks[id]===undefined)delete marks[id];
  document.querySelectorAll(`.tcard`);render()}
window.mark=mark;
function updateProg(){const S=T[LANG];const p=document.getElementById('prog');if(p)p.textContent=`${Object.keys(marks).length} ${S.of} ${backbone.length} ${S.marked}`}
function showResult(){
  const S=T[LANG];
  const known=knownSet();
  // readiness over backbone
  let score=0;backbone.forEach(t=>{if(marks[t.id]==='yes')score+=1;else if(marks[t.id]==='part')score+=0.5});
  const pct=Math.round(100*score/Math.max(1,backbone.length));
  // strengths: subjects with most yes among backbone
  const bySub={};backbone.forEach(t=>{if(marks[t.id]==='yes'){bySub[t.subject]=(bySub[t.subject]||0)+1}});
  const strengths=Object.entries(bySub).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  // next: not-known topics whose prereqs all known — from backbone first then class-adjacent
  const isKnown=id=>known.has(id);
  const ready=t=>!isKnown(t.id) && (pars[t.id]||[]).every(isKnown);
  let nexts=backbone.filter(t=>marks[t.id]!=='yes' && ready(t));
  if(nexts.length<4){
    const extra=topics.filter(t=>t.ageRangeStart>=cls.lo && t.ageRangeStart<cls.hi+2 && !backbone.includes(t) && ready(t));
    extra.sort((a,b)=>(b.centrality||0)-(a.centrality||0));
    nexts=nexts.concat(extra.slice(0,6-nexts.length));
  }
  nexts=nexts.slice(0,5);
  // inferred beyond explicit
  const explicit=backbone.filter(t=>marks[t.id]==='yes').length;
  const inferred=known.size-explicit;
  // save
  localStorage.setItem('vz-child',JSON.stringify({cls:cls.id,label:cls[LANG],marks,known:[...known],ready:nexts.map(t=>t.id),pct,ts:Date.now()}));
  /* qualitative band — same number, no grade on a child */
  const band=pct>=70?'hi':(pct>=40?'mid':'lo');
  const marked=Object.keys(marks).length;
  /* three questions for tonight, from the topics worth playing with now */
  let q3list=nexts.filter(t=>t.assessmentPrompt).slice(0,3);
  if(q3list.length<3){const seen=new Set(q3list.map(t=>t.id));
    const rest=backbone.filter(t=>marks[t.id]!=='yes'&&t.assessmentPrompt&&!seen.has(t.id))
      .concat(topics.filter(t=>t.assessmentPrompt&&t.ageRangeStart>=cls.lo&&t.ageRangeStart<cls.hi&&!seen.has(t.id))
        .sort((a,b)=>(b.centrality||0)-(a.centrality||0)));
    for(const t of rest){if(q3list.length>=3)break;if(!seen.has(t.id)){seen.add(t.id);q3list.push(t)}}}
  const q3subj=[...new Set(q3list.map(t=>subjName(t.subject)))].join(' · ');
  const app=document.getElementById('app');app.dataset.mode='result';
  app.innerHTML=`<div class="res">
    <div class="big"><div class="band">${S.bands[band]}</div><div class="pctlbl">${S.bandsub[band]}</div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="cnt">${S.counted(marked,backbone.length)} · ${cls[LANG]}</div>
      ${inferred>0?`<div style="color:var(--muted);font-size:15px;margin-top:10px">${S.infMsg(inferred)}</div>`:''}</div>
    <div class="disc">${S.disc}<span class="coi">${S.coi}</span></div>
    ${q3list.length===3?`<div class="sec"><h4>${S.q3h}${ltTag()}</h4>${q3Card(q3list,`${cls.lo}–${cls.hi}`,q3subj)}</div>`:''}
    <div class="sec">${mlForm(cls.id)}</div>
    ${strengths.length?`<div class="sec"><h4>${S.strengths}</h4><div class="chips">${strengths.map(s=>`<span class="chip">${subjName(s)}</span>`).join('')}</div></div>`:''}
    <div class="sec"><h4>${S.nextH}${ltTag()}</h4>${nexts.length?nexts.map(t=>`<div class="next"><div class="nm" style="color:${COL[t.subject]||'var(--ink)'}">${t.name}</div><div class="pr">${fillName(t.assessmentPrompt||t.description||'')}</div></div>`).join(''):`<p style="color:var(--muted)">${S.noNext}</p>`}</div>
    <a class="btn" href="../?mode=child">${S.onMap}</a>
    <button class="btn ghost" onclick="doShare()">${S.share}</button>
    <button class="btn ghost" onclick="cls=null;marks={};document.getElementById('app').dataset.mode='';render()">${S.again}</button>
  </div>`;
  window.scrollTo(0,0);
}
window.showResult=showResult;
function doShare(){const S=T[LANG];const url=location.origin+location.pathname;const txt=LANG==='en'?'See what your child already knows — a 5-min check on Lithuania\'s official curriculum:':'Pažiūrėkite, ką jūsų vaikas jau moka — 5 min patikra pagal oficialią LT programą:';
  if(navigator.share){navigator.share({title:'Kur mano vaikas?',text:txt,url})}else{navigator.clipboard.writeText(url);alert(S.copied)}}
window.doShare=doShare;
</script>
